# Project settings. Code reads this through nfl_scout.config.load_settings().

models:
  # Short names used everywhere else in this file and in NFL_SCOUT_MODEL.
  aliases:
    haiku: claude-haiku-5-5
    sonnet: claude-sonnet-5-5
    opus: claude-opus-5-5

  # Haiku throughout; Sonnet/Opus only for the optional comparison runs.
  default: haiku

  # Per-node model and effort. Any node missing here uses `default` and `default_effort`.
  default_effort: low
  nodes:
    planner:          {model: haiku, effort: low}
    offense_analyst:  {model: haiku, effort: low}
    defense_analyst:  {model: haiku, effort: low}
    injury_analyst:   {model: haiku, effort: low}
    matchup_analyst:  {model: haiku, effort: medium}
    fact_checker:     {model: haiku, effort: low}
    editor:           {model: haiku, effort: medium}

  max_revision_loops: 2

  # USD per million tokens (Anthropic API, Oct 2026). Haiku's rates hold for prompts up to 100K
  # tokens. cache_write is the 5-minute TTL (1.25x input); cache_read is 0.1x input (Opus 0.05x).
  prices:
    haiku:  {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
    sonnet: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
    opus:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}

data:
  # Seasons loaded into DuckDB. 2026 is the clean eval season (after every model's training cutoff).
  seasons: [2025, 2026]
  eval_season: 2026
  duckdb_path: data/nfl.duckdb

eval:
  # Weeks the frozen eval matchups are drawn from; each runs with through_week = week - 1.
  weeks: [4, 5, 6, 7]
  n_matchups: 40
  independent_check_fraction: 0.2

paths:
  runs_dir: runs
